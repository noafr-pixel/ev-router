<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Router — ישראל</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green:#1D9E75; --green-light:#E1F5EE; --green-dark:#0F6E56;
      --red:#E24B4A; --red-light:#FCEBEB;
      --amber:#EF9F27; --amber-light:#FAEEDA;
      --blue:#3B8BD4;
      --bg:#F4F6F4; --card:#FFFFFF; --text:#1A1A18; --muted:#888780; --border:#E5E7E5;
      --shadow:0 2px 16px rgba(0,0,0,0.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;direction:rtl}
    .topbar{background:var(--green);padding:1rem 1.25rem 1.25rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(29,158,117,.3)}
    .topbar-inner{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:10px}
    .logo{font-size:1.3rem;font-weight:700;color:#fff;letter-spacing:-.5px}
    .logo span{opacity:.75;font-weight:400;font-size:1rem}
    .page{max-width:480px;margin:0 auto;padding:1.25rem}
    .card{background:var(--card);border-radius:16px;padding:1.25rem;box-shadow:var(--shadow);margin-bottom:1rem}
    .card-title{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:1rem}
    .field-group{margin-bottom:.9rem}
    label{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-bottom:5px}
    .input-wrap{position:relative}
    .input-icon{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:1rem;pointer-events:none}
    input[type=text],input[type=number],select{width:100%;padding:10px 36px 10px 12px;border:1.5px solid var(--border);border-radius:10px;font-family:'Heebo',sans-serif;font-size:.92rem;color:var(--text);background:var(--bg);transition:border-color .2s;appearance:none;-webkit-appearance:none}
    input:focus,select:focus{outline:none;border-color:var(--green);background:#fff}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .location-row{display:flex;gap:8px}
    .location-row .autocomplete-wrap{flex:1}
    .btn-gps{flex-shrink:0;width:44px;height:44px;background:var(--green-light);border:1.5px solid var(--green);border-radius:10px;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
    .btn-gps:hover{background:var(--green)}
    .btn-gps.loading{animation:pulse 1s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .location-status{font-size:.78rem;color:var(--green-dark);margin-top:5px;padding:4px 8px;background:var(--green-light);border-radius:6px}
    .location-status.error{color:var(--red);background:var(--red-light)}
    .autocomplete-wrap{position:relative}
    .suggestions-list{position:absolute;top:100%;right:0;left:0;z-index:50;background:var(--card);border:1.5px solid var(--green);border-radius:10px;box-shadow:var(--shadow);max-height:200px;overflow-y:auto;margin-top:2px}
    .suggestion-item{padding:9px 12px;font-size:.85rem;cursor:pointer;border-bottom:1px solid var(--border);line-height:1.3}
    .suggestion-item:last-child{border-bottom:none}
    .suggestion-item:hover{background:var(--green-light)}
    .btn-search{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:12px;font-family:'Heebo',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .1s;margin-top:.25rem}
    .btn-search:hover{background:var(--green-dark)}
    .btn-search:active{transform:scale(.98)}
    .btn-search:disabled{background:var(--muted);cursor:not-allowed}
    .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
    @keyframes spin{to{transform:rotate(360deg)}}
    #results{display:none}
    .recommended-banner{background:var(--green);color:#fff;border-radius:12px 12px 0 0;padding:10px 14px;font-size:.78rem;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
    .station-card{background:var(--card);border-radius:12px;padding:1rem;margin-bottom:.75rem;box-shadow:var(--shadow);border:1.5px solid transparent;transition:border-color .2s,box-shadow .2s;cursor:pointer}
    .station-card:hover{box-shadow:0 4px 20px rgba(0,0,0,.12)}
    .station-card.recommended{border-color:var(--green);border-radius:0 0 12px 12px;margin-top:0}
    .station-card.full{opacity:.6}
    .station-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
    .station-name{font-size:.95rem;font-weight:600;line-height:1.3}
    .station-dist{font-size:.8rem;color:var(--muted);white-space:nowrap}
    .station-meta{font-size:.78rem;color:var(--muted);margin-bottom:8px}
    .progress-track{background:var(--border);border-radius:99px;height:5px;margin-bottom:5px}
    .progress-fill{height:5px;border-radius:99px;transition:width .6s ease}
    .station-footer{display:flex;align-items:center;justify-content:space-between}
    .load-text{font-size:.75rem;color:var(--muted)}
    .badge{font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:3px}
    .badge-green{background:var(--green-light);color:var(--green-dark)}
    .badge-amber{background:var(--amber-light);color:#7A4E0A}
    .badge-red{background:var(--red-light);color:#7A1F1F}
    .badge-blue{background:#E6F1FB;color:#185FA5}
    .badge-grey{background:#F0F0F0;color:#666}
    .charge-times{background:#F8FBF9;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.78rem;border:1px solid var(--green-light)}
    .charge-times-title{font-weight:600;color:var(--green-dark);margin-bottom:5px;font-size:.75rem}
    .charge-row{display:flex;justify-content:space-between;padding:2px 0}
    .charge-label{color:var(--muted)}
    .charge-val{font-weight:600}
    .btn-report{font-size:.72rem;color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer;margin-top:8px;font-family:'Heebo',sans-serif;transition:border-color .2s,color .2s}
    .btn-report:hover{border-color:var(--green);color:var(--green-dark)}
    .btn-navigate{width:100%;padding:13px;background:var(--green-dark);color:#fff;border:none;border-radius:12px;font-family:'Heebo',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:.5rem;transition:background .2s}
    .btn-navigate:hover{background:#0a5542}
    .no-results{text-align:center;padding:2rem 1rem;color:var(--muted)}
    .no-results-icon{font-size:2.5rem;margin-bottom:.75rem}
    .no-results h3{font-size:1rem;color:var(--text);margin-bottom:.5rem}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end}
    .overlay.open{display:flex}
    .sheet{background:var(--card);border-radius:20px 20px 0 0;padding:1.5rem 1.25rem;width:100%;max-width:480px;margin:0 auto;animation:slideUp .28s ease;max-height:85vh;overflow-y:auto}
    @keyframes slideUp{from{transform:translateY(60px);opacity:0}}
    .sheet-handle{width:36px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 1.25rem}
    .sheet-title{font-size:1.1rem;font-weight:700;margin-bottom:.25rem}
    .sheet-sub{font-size:.82rem;color:var(--muted);margin-bottom:1.25rem}
    .detail-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:.88rem}
    .detail-row:last-of-type{border-bottom:none}
    .detail-label{color:var(--muted)}
    .detail-value{font-weight:500}
    .report-count-wrap{display:flex;align-items:center;gap:12px;margin:1rem 0}
    .count-btn{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--border);background:var(--bg);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:'Heebo',sans-serif}
    .count-btn:hover{border-color:var(--green)}
    .count-display{flex:1;text-align:center;font-size:1.5rem;font-weight:700}
    .btn-submit-report{width:100%;padding:13px;background:var(--green);color:#fff;border:none;border-radius:12px;font-family:'Heebo',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.5rem}
    .btn-submit-report:hover{background:var(--green-dark)}
    .fade-in{animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}}
    .section-label{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:1rem 0 .5rem}
    .offline-note{font-size:.72rem;color:var(--muted);text-align:center;margin-top:.5rem;padding:6px;background:#f9f9f9;border-radius:8px}
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">⚡ EV Router <span>ישראל</span></div>
  </div>
</div>

<div class="page">
  <div class="card" style="margin-top:.5rem">
    <div class="card-title">🔍 חפש עמדת טעינה</div>

    <div class="field-group">
      <label>מיקום נוכחי</label>
      <div class="location-row">
        <div class="autocomplete-wrap input-wrap">
          <span class="input-icon">📍</span>
          <input type="text" id="inp-address" placeholder="הזן כתובת ועיר... (לדוגמה: הרצל 10, חיפה)" autocomplete="off" oninput="onAddressInput()">
          <div id="suggestions" class="suggestions-list" style="display:none"></div>
        </div>
        <button class="btn-gps" id="btn-gps" onclick="useGPS()" title="מיקום נוכחי">🎯</button>
      </div>
      <div id="location-status" class="location-status" style="display:none"></div>
    </div>

    <div class="field-group">
      <label>סוללה (אופציונלי — לחישוב זמן טעינה)</label>
      <div class="two-col">
        <div class="input-wrap">
          <span class="input-icon">🔋</span>
          <input type="number" id="inp-battery" min="1" max="99" placeholder="% נוכחי">
        </div>
        <div class="input-wrap">
          <span class="input-icon">⚡</span>
          <input type="number" id="inp-kwh" min="10" max="200" placeholder="kWh (לדוגמה: 60)">
        </div>
      </div>
    </div>

    <div class="field-group">
      <label>העדפת טעינה</label>
      <div class="input-wrap">
        <span class="input-icon">🔌</span>
        <select id="inp-pref">
          <option value="any">כלשהי — מהירה או איטית</option>
          <option value="fast">מהירה בלבד (DC)</option>
          <option value="slow">איטית בלבד (AC)</option>
        </select>
      </div>
    </div>

    <button class="btn-search" id="btn-search" onclick="findStation()">
      <span id="btn-text">חפש עמדה</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <div class="offline-note">3,255 אתרי טעינה בכל הארץ · מקור: מאגר משרד האנרגיה (Cello Charge), 21.11.2026<br>פועל ללא אינטרנט · השלמת כתובת דורשת חיבור</div>
  </div>

  <div id="results" class="fade-in">
    <div id="recommended-section"></div>
    <div id="other-section"></div>
    <div id="no-results" class="no-results" style="display:none">
      <div class="no-results-icon">🔌</div>
      <h3>לא נמצאו עמדות</h3>
      <p>אין עמדות בטווח 5 ק"מ עם ההגדרות שבחרת.</p>
    </div>
  </div>
</div>

<!-- Bottom Sheet -->
<div class="overlay" id="overlay" onclick="closeSheet(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-name"></div>
    <div class="sheet-sub" id="sheet-sub"></div>
    <div id="sheet-details"></div>
    <button class="btn-navigate" onclick="openNav()">🗺 נווט לכאן</button>
  </div>
</div>

<!-- דיאלוג דיווח -->
<div class="overlay" id="report-overlay" onclick="closeReportDialog(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">📊 דווח על עומס</div>
    <div class="sheet-sub" id="report-station-name"></div>
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:.5rem">כמה רכבים נמצאים כרגע בתחנה?</p>
    <div class="report-count-wrap">
      <button class="count-btn" onclick="changeCount(-1)">−</button>
      <div class="count-display" id="report-count-display">0</div>
      <button class="count-btn" onclick="changeCount(1)">+</button>
    </div>
    <p style="font-size:.72rem;color:var(--muted);text-align:center;margin-bottom:.75rem">הדיווח נשמר במכשיר שלך</p>
    <button class="btn-submit-report" onclick="submitReport()">✓ שלח דיווח</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════

// ══════════════════════════════════════════
// אלגוריתם Min-Cost Max-Flow — Cost-Scaling Push-Relabel (JavaScript)
// 1. הנהג המחפש מקבל את התחנה הקרובה ביותר שיש בה שקע פנוי
//    (אם הקרובה מלאה לפי דיווחי העומס — את הבאה אחריה)
// 2. לשאר הנהגים: מקסימום נהגים משובצים, ובמינימום מרחק כולל
// ══════════════════════════════════════════
function haversine(lat1,lon1,lat2,lon2){
  const R=6371,d2r=Math.PI/180;
  const dlat=(lat2-lat1)*d2r, dlon=(lon2-lon1)*d2r;
  const a=Math.sin(dlat/2)**2+Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dlon/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}

// תחנות ברדיוס maxDist לפי העדפה, ממוינות מהקרובה לרחוקה
function stationsNear(lat,lon,maxDist,pref){
  const dLat=maxDist/111, dLon=maxDist/(111*Math.cos(lat*Math.PI/180));
  const out=[];
  for(const s of STATIONS){
    if(Math.abs(s.lat-lat)>dLat||Math.abs(s.lon-lon)>dLon)continue;
    if(pref==="fast"&&s.fast===0)continue;
    if(pref==="slow"&&s.slow===0)continue;
    const dist=haversine(lat,lon,s.lat,s.lon);
    if(dist<=maxDist)out.push({s,dist});
  }
  out.sort((a,b)=>a.dist-b.dist);
  return out;
}
function freeSlots(s,occ){ return Math.max(0,s.cap-((occ||{})[s.id]||0)); }

// ── רשת זרימה: כל קשת e והקשת ההפוכה שלה e^1 ──
class FlowNetwork{
  constructor(){this.index={};this.names=[];this.adj=[];this.to=[];this.cap=[];this.cost=[];this.flow=[];}
  node(name){
    if(!(name in this.index)){this.index[name]=this.names.length;this.names.push(name);this.adj.push([]);}
    return this.index[name];
  }
  addEdge(u,v,cap,cost){
    u=this.node(u); v=this.node(v);
    for(const [a,b,c,w] of [[u,v,cap,cost],[v,u,0,-cost]]){
      this.adj[a].push(this.to.length); this.to.push(b); this.cap.push(c); this.cost.push(w); this.flow.push(0);
    }
  }
  residual(e){return this.cap[e]-this.flow[e];}
  flowBetween(u,v){
    if(!(u in this.index)||!(v in this.index))return 0;
    const iu=this.index[u], iv=this.index[v]; let f=0;
    for(const e of this.adj[iu]) if(this.to[e]===iv&&this.cap[e]>0) f+=this.flow[e];
    return f;
  }
}

// ── Cost-Scaling Push-Relabel (Goldberg & Tarjan) ──
function minCostMaxFlow(net,source,sink,maxFlowBound){
  const s=net.index[source], t=net.index[sink], n=net.names.length;
  // קשת SINK→SOURCE בעלות שלילית גדולה → זרימה מקסימלית קודמת למרחק
  let maxEdge=1; for(const c of net.cost) if(c>maxEdge)maxEdge=c;
  const BIG=maxEdge*n+1;
  net.addEdge(sink,source,maxFlowBound,-BIG);
  const retEdge=net.to.length-2, m=net.to.length;
  const scaled=net.cost.map(c=>c*n);
  const price=new Array(n).fill(0), excess=new Array(n).fill(0);
  const alpha=8; let eps=1; for(const c of scaled) if(Math.abs(c)>eps)eps=Math.abs(c);
  let ops=0;
  const reduced=(e,u)=>scaled[e]+price[u]-price[net.to[e]];

  while(true){
    eps=Math.max(1,Math.floor(eps/alpha));
    // refine(ε) — רוויית קשתות עם עלות מופחתת שלילית
    for(let u=0;u<n;u++) for(const e of net.adj[u]){
      const r=net.residual(e);
      if(r>0&&reduced(e,u)<0){const v=net.to[e];net.flow[e]+=r;net.flow[e^1]-=r;excess[u]-=r;excess[v]+=r;}
    }
    // Push / Relabel
    const queue=[]; let qh=0; const inQ=new Array(n).fill(false); const cur=new Array(n).fill(0);
    for(let u=0;u<n;u++) if(excess[u]>0){queue.push(u);inQ[u]=true;}
    while(qh<queue.length){
      const u=queue[qh++]; inQ[u]=false;
      while(excess[u]>0){
        if(cur[u]===net.adj[u].length){
          // Relabel
          let best=-Infinity;
          for(const e of net.adj[u]) if(net.residual(e)>0){const val=price[net.to[e]]-scaled[e]; if(val>best)best=val;}
          price[u]=best-eps; cur[u]=0; ops++; continue;
        }
        const e=net.adj[u][cur[u]], r=net.residual(e);
        if(r>0&&reduced(e,u)<0){
          // Push
          const v=net.to[e], d=Math.min(excess[u],r);
          net.flow[e]+=d; net.flow[e^1]-=d; excess[u]-=d; excess[v]+=d; ops++;
          if(excess[v]>0&&!inQ[v]){queue.push(v);inQ[v]=true;}
        } else cur[u]++;
      }
    }
    if(eps===1)break;
  }
  let totalCost=0; for(let e=0;e<m;e+=2) if(e!==retEdge) totalCost+=net.flow[e]*net.cost[e];
  return{totalFlow:net.flow[retEdge],totalCost,ops};
}

function buildGraph(drivers,pref,maxDist,occ,reserved){
  const SOURCE="SOURCE", SINK="SINK", net=new FlowNetwork();
  net.node(SOURCE); net.node(SINK);
  const driverReachable={}, used={};
  for(const d of drivers){
    net.addEdge(SOURCE,d.id,1,0);
    const reach=[];
    for(const {s,dist} of stationsNear(d.lat,d.lon,maxDist,pref)){
      net.addEdge(d.id,s.id,1,Math.round(dist*1000));   // עלות = מרחק במטרים
      used[s.id]=s;
      reach.push({station_id:s.id,dist:Math.round(dist*100)/100});
    }
    driverReachable[d.id]=reach;
  }
  for(const s of Object.values(used)){
    const avail=freeSlots(s,occ)-((reserved||{})[s.id]||0);
    if(avail>0)net.addEdge(s.id,SINK,avail,0);
  }
  return{net,driverReachable,usedStations:Object.values(used),SOURCE,SINK};
}

function runAlgorithm(drivers,pref,maxDist,occ,priorityId){
  const assignments={}, reserved={};
  let others=drivers, pd=null;

  // שלב 1: הנהג המחפש — התחנה הקרובה הפנויה
  if(priorityId){
    pd=drivers.find(d=>d.id===priorityId)||null;
    if(pd){
      others=drivers.filter(d=>d.id!==priorityId);
      let skipped=0;
      for(const {s,dist} of stationsNear(pd.lat,pd.lon,maxDist,pref)){
        if(freeSlots(s,occ)>0){
          reserved[s.id]=1;
          assignments[pd.id]={station_id:s.id,station_name:s.name,dist:Math.round(dist*100)/100,fast:s.fast>0,operator:s.operator,skipped_full:skipped};
          break;
        }
        skipped++;
      }
    }
  }

  // שלב 2: Min-Cost Max-Flow לשאר הנהגים
  const{net,driverReachable,usedStations,SOURCE,SINK}=buildGraph(others,pref,maxDist,occ,reserved);
  const{totalFlow}=minCostMaxFlow(net,SOURCE,SINK,Math.max(others.length,1));
  for(const d of others){
    for(const r of (driverReachable[d.id]||[])){
      if(net.flowBetween(d.id,r.station_id)>0){
        const s=STATIONS_BY_ID[r.station_id];
        assignments[d.id]={station_id:s.id,station_name:s.name,dist:r.dist,fast:s.fast>0,operator:s.operator};
        break;
      }
    }
  }

  const shown={}; for(const s of usedStations)shown[s.id]=s;
  if(pd) for(const {s} of stationsNear(pd.lat,pd.lon,maxDist,pref)) shown[s.id]=s;
  const stationLoads={};
  for(const s of Object.values(shown)){
    const rep=(occ||{})[s.id];
    const hasReport=rep!=null;
    const fillPct=hasReport?Math.min(Math.round(rep/Math.max(s.cap,1)*100),100):0;
    stationLoads[s.id]={...s,load:hasReport?rep:0,fill_pct:fillPct,has_report:hasReport};
  }
  return{assignments,stationLoads,totalFlow:Object.keys(assignments).length};
}

// נהגי demo — 30 נהגי רקע סביב מיקום החיפוש (±3 ק"מ)

function seededRandom(seed){
  let s=seed;
  return()=>{s=(s*1664525+1013904223)&0xffffffff;return(s>>>0)/0xffffffff;};
}
function buildDemoDrivers(lat,lon){
  const seed=Math.round(lat*100)*100000+Math.round(lon*100);
  const rng=seededRandom(seed); const drivers=[]; const spread=0.03;
  for(let i=0;i<30;i++){
    drivers.push({id:`D${i+1}`,lat:lat+(rng()*2-1)*spread,lon:lon+(rng()*2-1)*spread});
  }
  return drivers;
}

function onAddressInput(){
  currentLat=null;currentLon=null;setLocationStatus(null);
  const q=document.getElementById("inp-address").value.trim();
  clearTimeout(autocompleteTimer);
  if(q.length<2){hideSuggestions();return;}
  autocompleteTimer=setTimeout(()=>fetchSuggestions(q),350);
}
async function fetchSuggestions(q){
  try{
    const url="https://nominatim.openstreetmap.org/search?q="+encodeURIComponent(q)+"&format=json&limit=5&countrycodes=il&accept-language=he";
    const res=await fetch(url,{headers:{"User-Agent":"EV-Router/1.0"}});
    const data=await res.json();
    showSuggestions(data.map(r=>({lat:+r.lat,lon:+r.lon,display:r.display_name})));
  }catch{hideSuggestions();}
}
function showSuggestions(results){
  const list=document.getElementById("suggestions");
  list.innerHTML="";
  if(!results.length){list.style.display="none";return;}
  results.forEach(r=>{
    const item=document.createElement("div");
    item.className="suggestion-item";
    item.textContent=r.display.split(",").slice(0,3).join(", ");
    item.onclick=()=>selectSuggestion(r);
    list.appendChild(item);
  });
  list.style.display="block";
}
function selectSuggestion(r){
  currentLat=r.lat;currentLon=r.lon;
  const short=r.display.split(",").slice(0,2).join(", ");
  document.getElementById("inp-address").value=short;
  hideSuggestions(); setLocationStatus("📍 "+short);
}
function hideSuggestions(){document.getElementById("suggestions").style.display="none";}
document.addEventListener("click",e=>{if(!document.getElementById("inp-address").contains(e.target))hideSuggestions();});

  const url="https://nominatim.openstreetmap.org/search?q="+encodeURIComponent(address)+"&format=json&limit=1&countrycodes=il";
  const res=await fetch(url,{headers:{"User-Agent":"EV-Router/1.0"}});

function fmtMin(m){if(m<60)return m+" דק'";const h=Math.floor(m/60),r=m%60;return r?`${h}h ${r} דק'`:`${h} שעות`;}
function calcCharge(soc,isFast,kwh){
  if(!kwh||kwh<=0)kwh=60;
  if(soc>=99)return"מלא";
  if(isFast){
    if(soc>=80){const m=Math.round((100-soc)/100*kwh/(50*0.25)*60);return fmtMin(m)+" (עד 100%)";}
    const m=Math.round((80-soc)/100*kwh/50*60);return fmtMin(m)+" (עד 80%)";
  }
  return fmtMin(Math.round((100-soc)/100*kwh/7.4*60))+" (עד 100%)";
}
function buildChargeTimes(s,soc,kwh){
  if(!soc||soc<=0||soc>=100)return"";
  let rows="";
  if(s.fast>0)rows+=`<div class="charge-row"><span class="charge-label">⚡ מהיר DC (50 kW)</span><span class="charge-val">${calcCharge(soc,true,kwh)}</span></div>`;
  if(s.slow>0)rows+=`<div class="charge-row"><span class="charge-label">🐢 איטי AC (7.4 kW)</span><span class="charge-val">${calcCharge(soc,false,kwh)}</span></div>`;
  if(!rows)return"";
  return`<div class="charge-times"><div class="charge-times-title">זמן טעינה משוער מ-${soc}%</div>${rows}</div>`;
}

// ── חיפוש ──
async function findStation(){
  let lat=currentLat, lon=currentLon;
  document.getElementById("btn-text").textContent="מחפש...";
  document.getElementById("spinner").style.display="block";
  document.getElementById("btn-search").disabled=true;
  hideSuggestions();

  try{
    if(!lat||!lon){
      const addr=document.getElementById("inp-address").value.trim();
      if(!addr){alert("נא להזין כתובת או ללחוץ על 🎯");return;}
      document.getElementById("btn-text").textContent="ממפה כתובת...";
      const geo=await geocodeAddress(addr);
      if(geo.error){alert("לא נמצאה כתובת — נסי לפרט יותר (רחוב + עיר)");return;}
      lat=geo.lat;lon=geo.lon;
      setLocationStatus("📍 "+(geo.display_name?geo.display_name.split(",").slice(0,2).join(","):addr));
    }

    currentSoc=parseInt(document.getElementById("inp-battery").value)||0;
    currentKwh=parseFloat(document.getElementById("inp-kwh").value)||60;
    const pref=document.getElementById("inp-pref").value;

    OCCUPANCY=loadOccupancy();
    const userDriver={id:"USER",lat,lon};
    const allDrivers=[userDriver,...buildDemoDrivers(lat,lon)];
    const{assignments,stationLoads}=runAlgorithm(allDrivers,pref,5.0,OCCUPANCY,"USER");

    const userAssignment=assignments["USER"];

    const nearbyStations=[];
    for(const s of Object.values(stationLoads)){
      if(pref==="fast"&&s.fast===0)continue;
      if(pref==="slow"&&s.slow===0)continue;
      const dist=haversine(lat,lon,s.lat,s.lon);
      if(dist<=5.0)nearbyStations.push({...s,dist:Math.round(dist*100)/100});
    }
    nearbyStations.sort((a,b)=>a.dist-b.dist);

    renderResults({assignment:userAssignment,nearby_stations:nearbyStations},lat,lon);

    // דיווח לשרת המרכזי (אם מוגדר) — כושל בשקט אם לא זמין
    if(SERVER_URL){
      try{
        await fetch(SERVER_URL+"/api/log-driver",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({lat,lon,assignment:userAssignment?.station_id||null})
        });
      }catch(_){}
    }
  }catch(e){
    alert("שגיאה: "+e.message);
  }finally{
    document.getElementById("btn-text").textContent="חפש עמדה";
    document.getElementById("spinner").style.display="none";
    document.getElementById("btn-search").disabled=false;
  }
}

// ── רינדור ──
function renderResults(data,uLat,uLon){
  const results=document.getElementById("results");
  results.style.display="block";
  const recSec=document.getElementById("recommended-section");
  const othSec=document.getElementById("other-section");
  const noRes=document.getElementById("no-results");
  recSec.innerHTML=""; othSec.innerHTML=""; noRes.style.display="none";

  const stations=data.nearby_stations||[];
  if(!stations.length){noRes.style.display="block";return;}

  stations.forEach(s=>{stationsMap[s.id]=s;});
  const recId=data.assignment?.station_id;
  const rec=stations.filter(s=>s.id===recId);
  const oth=stations.filter(s=>s.id!==recId);

  if(rec.length){
    const sk=data.assignment?.skipped_full||0;
    const note=sk>0?` · ${sk===1?"העמדה הקרובה ביותר מלאה":sk+" עמדות קרובות יותר מלאות"} — הוצעה הבאה בתור`:" · העמדה הקרובה ביותר שפנויה";
    recSec.innerHTML=`<div class="recommended-banner">✦ מומלץ (Min-Cost Flow)${note}</div>`;
    recSec.appendChild(buildCard(rec[0],true));
  }
  if(oth.length){
    const lbl=document.createElement("div");
    lbl.className="section-label"; lbl.textContent="עמדות נוספות בטווח";
    othSec.appendChild(lbl);
    oth.forEach(s=>othSec.appendChild(buildCard(s,false)));
  }
  results.scrollIntoView({behavior:"smooth",block:"start"});
}

function buildCard(s,isRec){
  const fillColor=s.fill_pct>=100?"var(--red)":s.fill_pct>=50?"var(--amber)":"var(--green)";
  let badge;
  if(!s.has_report)badge=`<span class="badge badge-grey">❓ לא ידוע</span>`;
  else if(s.fill_pct>=100)badge=`<span class="badge badge-red">✗ מלא</span>`;
  else if(s.fill_pct>=50)badge=`<span class="badge badge-amber">⚠ עמוס</span>`;
  else if(s.fill_pct>0)badge=`<span class="badge badge-amber">~ חלקית</span>`;
  else badge=`<span class="badge badge-green">✓ פנוי</span>`;

  const typeTag=s.fast>0
    ?`<span class="badge badge-blue">⚡ ${s.fast} DC</span>`
    :`<span class="badge" style="background:#F5F5F5;color:#666">🐢 ${s.slow} AC</span>`;

  const occLine=s.has_report
    ?`<div class="progress-track"><div class="progress-fill" style="width:${s.fill_pct}%;background:${fillColor}"></div></div>
      <div class="station-footer"><div class="load-text">עומס: ${s.fill_pct}% (${s.load}/${s.cap})</div><div style="display:flex;gap:6px">${typeTag} ${badge}</div></div>`
    :`<div class="station-footer"><div class="load-text" style="color:var(--muted)">עומס לא ידוע</div><div style="display:flex;gap:6px">${typeTag} ${badge}</div></div>`;

  const card=document.createElement("div");
  card.className="station-card"+(isRec?" recommended":"")+(s.has_report&&s.fill_pct>=100?" full":"");
  card.innerHTML=`
    <div class="station-header"><div class="station-name">${s.name}</div><div class="station-dist">${s.dist} ק"מ</div></div>
    <div class="station-meta">${s.operator}${s.city?" · "+s.city:""} · ${s.cap} עמדות</div>
    ${occLine}
    ${buildChargeTimes(s,currentSoc,currentKwh)}
    <button class="btn-report" onclick="event.stopPropagation();openReportDialog('${s.id}')">📊 דווח עומס</button>`;
  card.onclick=()=>openSheet(s);
  return card;
}

function openSheet(s){
  currentStation=s;
  document.getElementById("sheet-name").textContent=s.name;
  document.getElementById("sheet-sub").textContent=s.operator+(s.city?" · "+s.city:"")+" · "+s.dist+' ק"מ';
  const fillColor=s.fill_pct>=100?"var(--red)":s.fill_pct>=50?"var(--amber)":"var(--green)";
  const occRow=s.has_report
    ?`<div class="detail-row"><span class="detail-label">עומס מדווח</span><span class="detail-value" style="color:${fillColor}">${s.fill_pct}% (${s.load}/${s.cap})</span></div>`
    :`<div class="detail-row"><span class="detail-label">עומס</span><span class="detail-value" style="color:var(--muted)">לא ידוע</span></div>`;
  const ct=currentSoc>0?buildChargeTimes(s,currentSoc,currentKwh):`<p style="font-size:.78rem;color:var(--muted);margin-top:10px">הכנסי % סוללה לחישוב זמן טעינה</p>`;
  document.getElementById("sheet-details").innerHTML=`
    <div class="detail-row"><span class="detail-label">עמדות מהירות (DC)</span><span class="detail-value">${s.fast}</span></div>
    <div class="detail-row"><span class="detail-label">עמדות איטיות (AC)</span><span class="detail-value">${s.slow}</span></div>
    <div class="detail-row"><span class="detail-label">קיבולת כוללת</span><span class="detail-value">${s.cap}</span></div>
    ${occRow}
    <div class="detail-row"><span class="detail-label">מרחק ממני</span><span class="detail-value">${s.dist} ק"מ</span></div>
    ${ct}`;
  document.getElementById("overlay").classList.add("open");
}
function closeSheet(e){if(e.target===document.getElementById("overlay"))document.getElementById("overlay").classList.remove("open");}
function openNav(){if(!currentStation)return;window.open(`https://waze.com/ul?ll=${currentStation.lat},${currentStation.lon}&navigate=yes`,"_blank");}

// ── דיווח עומס ──
function openReportDialog(sid){
  const s=stationsMap[sid]; if(!s)return;
  reportStation=s; reportCount=s.load||0;
  document.getElementById("report-station-name").textContent=s.name;
  document.getElementById("report-count-display").textContent=reportCount;
  document.getElementById("report-overlay").classList.add("open");
}
function changeCount(d){reportCount=Math.max(0,Math.min(reportCount+d,50));document.getElementById("report-count-display").textContent=reportCount;}
function closeReportDialog(e){if(e.target===document.getElementById("report-overlay"))document.getElementById("report-overlay").classList.remove("open");}
function submitReport(){
  if(!reportStation)return;
  OCCUPANCY[reportStation.id]=reportCount;
  saveOccupancy(OCCUPANCY);
  document.getElementById("report-overlay").classList.remove("open");
  alert(`תודה! הדיווח על "${reportStation.name}" נשמר.\nחפשי שוב לראות את העדכון.`);
}
</script>
